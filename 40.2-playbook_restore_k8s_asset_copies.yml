- name: Get k8s Copies
  hosts: localhost
  gather_facts: no
  connection: local
  vars_files: 
    - ./vars/main.yml
  tasks:
  - name: Checking Restore Type
    fail: 
      msg: "var restore_type must be of TO_EXISTING or TO_ALTERNATE"
    when: restore_type is defined and restore_type is not search('TO_EXISTING','TO_ALTERNATE')
  - name: Checking Required Variable ppdm_fqdn
    fail: 
      msg: "We do not have ppdm fqdn set !"
    when: (ppdm_fqdn is not defined) or (ppdm_fqdn|length <= 8)
  - name: Checking Required Variable ppdm_new_password
    fail: 
      msg: "We do not have ppdm_new_password  set !"
    when: (ppdm_new_password is not defined) or (ppdm_new_password|length == 0)  
  - name: Checking Required Variable namespace_name
    fail: 
      msg: "We do not have the namespace_name set !"
    when: (namespace_name is not defined) or (namespace_name|length <= 3)  
  - name: Checking Required Variable target_namespace_name
    fail: 
      msg: "We do not have the target_namespace_name set !"
    when: (target_namespace_name is not defined) or (target_namespace_name|length <= 3)     
  - name: Setting Base URL
    set_fact: 
      ppdm_baseurl: "https://{{ ppdm_fqdn | regex_replace('^https://') }}"     
  - name: Get PPDM Token for https://{{ ppdm_fqdn | regex_replace('^https://') }}
    include_role: 
      name: get_ppdm_token
    vars: 
      ppdm_password: "{{ ppdm_new_password }}"
  - debug:
      msg: "{{ get_ppdm_token_access_token }}"
      verbosity: 1
    name: do we have a token ?
  - name: Get PPDM Assets
    include_role:
      name: get_ppdm_assets
    vars:
        #get_ppdm_assets_filter: details.k8s.namespace in ("mysql", "mysql-rh", "openshift-image-registry", "powerstore", "scale002", "testpowerstore") and subtype eq "K8S_PERSISTENT_VOLUME_CLAIM"
        get_ppdm_assets_filter: name eq "{{ namespace_name }}" and type eq "KUBERNETES" and subtype eq "K8S_NAMESPACE" and lastAvailableCopyTime ne null
        #get_ppdm_assets_filter: type eq "KUBERNETES" and protectionStatus eq "PROTECTED" and details.k8s.namespac eq "{{ namespace_name }}"
  - name: Assets Result
    debug:
      msg: "{{ get_ppdm_assets_assets }}"
      verbosity: 1
  - name: Get PPDM Assetcopies
    include_role:
      name: get_ppdm_assetcopies
    vars:
        get_ppdm_assetcopies_id: "{{ get_ppdm_assets_assets[0].id }}"
  - name: Copies Result
    debug:
      msg: "{{ get_ppdm_assetcopies_copies[0] }}"
      verbosity: 0

  - name: Restore K8S Assetcopies
    include_role:
      name: restore_ppdm_k8s_copies
    vars:
        copy: "{{ get_ppdm_assetcopies_copies[0] }}"
        asset: "{{ get_ppdm_assets_assets[0] }}"
        message: "{{ ticket_reason | default('') }}"
        target_namespace: "{{ target_namespace_name }}"
        restoreType: "{{ restore_type | default('TO_ALTERNATE') }}"
  - name: Restore Result
    debug:
      msg: "{{ restore_ppdm_k8s_copies_restore }}"
      verbosity: 0
  - name: Wait Restore complete
    include_role:
      name: get_ppdm_activities
    vars:
      get_ppdm_activities_id: "{{ restore_ppdm_k8s_copies_restore.activityId }}"
      get_ppdm_activities_delay: 30
      get_ppdm_activities_retries: 30
      get_ppdm_activities_condition: get_ppdm_activities_result.json.state == "COMPLETED" or get_ppdm_activities_result.json.state == "FAILED"
    when: wait_activity is defined and restore_ppdm_k8s_copies_restore is defined
  - name: Result
    debug:
      msg: "{{ get_ppdm_activities_activities }}"
      verbosity: 0 
    when: activities is defined       