# Example Playbook to Precheck PPDM Update
#
# Note: Api is still called Upgrade, but Upgrade is for Hardware only !
# SO tasks will be named update but execute Upgrade
#
- name: Upgrade PPDM
  hosts: localhost
  gather_facts: no
  connection: local
  vars_files: 
    - ./vars/main.yml
  tasks:
  - name: Setting Base URL
    set_fact: 
      ppdm_baseurl: "https://{{ ppdm_fqdn | regex_replace('^https://') }}"     
  - name: Get PPDM Token for https://{{ ppdm_fqdn | regex_replace('^https://') }}
    include_role: 
      name: get_ppdm_token
    vars: 
      ppdm_password: "{{ ppdm_new_password }}"
  - debug:
      msg: "{{ get_ppdm_token_access_token }}"
      verbosity: 1
    name: do we have a token ?
  - name: get Update Package prior precheck
    include_role:
      name: get_ppdm_update_package
    vars:
      get_ppdm_update_package_filter: 'category eq "ACTIVE"'
  - name: display upgrade package failure prior precheck
    debug:
      msg: "{{ get_ppdm_update_package_update_package[0].upgradeError }}"
    when: get_ppdm_update_package_update_package[0] is defined and get_ppdm_update_package_update_package[0].upgradeError is defined
#    include_role:
#      name: delete_ppdm_update_package
#    vars:
#      id: "{{ get_ppdm_update_package_update_package[0].id }}"
  - name: precheck_ppdm_upgrade
    when: get_ppdm_update_package_update_package[0] is defined # and get_ppdm_update_package_update_package[0].upgradeError is not defined
    include_role:
      name: precheck_ppdm_update_package
    vars:
      id: "{{ get_ppdm_update_package_update_package[0].id }}"
  - debug:
      msg: "{{ validation_details }}"
      verbosity: 0
    when: validation_details is defined

  - name: get Update Package State After Precheck
    include_role:
      name: get_ppdm_update_package
    vars:
      get_ppdm_update_package_filter: 'category eq "ACTIVE"'
    when: get_ppdm_update_package_update_package[0] is defined and get_ppdm_update_package_update_package[0].upgradeError is defined

  - name: display Failure with exit
    debug:
      msg: "{{ get_ppdm_update_package_update_package[0].upgradeError }}"
    when: get_ppdm_update_package_update_package[0] is defined and get_ppdm_update_package_update_package[0].upgradeError is defined
    failed_when: get_ppdm_update_package_update_package[0] is defined and get_ppdm_update_package_update_package[0].upgradeError is defined
     
