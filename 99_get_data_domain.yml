# Example Playbook to configure PPDM Certificates
- name: Get PPDM Inventory Sources
  hosts: localhost
  gather_facts: no
  connection: local
  vars_files: 
    - ./vars/main.yml
  tasks:  
  - name: Setting Base URL
    set_fact: 
      ppdm_baseurl: "https://{{ ppdm_fqdn | regex_replace('^https://') }}"     
  - name: Get PPDM Token for https://{{ ppdm_fqdn | regex_replace('^https://') }}
    include_role: 
      name: get_ppdm_token
    vars: 
      ppdm_password: "{{ ppdm_new_password }}"
  - debug:
      msg: "{{ get_ppdm_token_access_token }}"
      verbosity: 1
    name: do we have a token ?

  - name: Get PPDM inventory-sources
    include_role:
      name: get_ppdm_inventory_sources
    vars:
      get_ppdm_inventory_sources_filter: name eq "{{ ddve_fqdn }}"


  - name: Get DataDomain Storage Systems via Inventory
    include_role:
      name: get_ppdm_inventory_sources
    vars:
      get_ppdm_inventory_sources_id: "{{ get_ppdm_inventory_sources_inventorysources[0].id }}"
      get_ppdm_inventory_sources_storagesystems: "true"
  - name: inventorysource Result
    debug:
      msg: "{{ get_ppdm_inventory_sources_inventorysources[0] }}"
      verbosity: 0
    when: get_ppdm_inventory_sources_inventorysources is defined  
    