# Example Playbook to Install PPDM Update
#
# Note: Api is still called Upgrade, but Upgrade is for Hardware only !
# SO tasks will be named update but execute Upgrade
#
- name: Upgrade PPDM
  hosts: localhost
  gather_facts: no
  connection: local
  vars_files: 
    - ./vars/main.yml
  tasks:
  - name: Setting Base URL
    set_fact: 
      ppdm_baseurl: "https://{{ ppdm_fqdn | regex_replace('^https://') }}"     
  - name: Get PPDM Token for https://{{ ppdm_fqdn | regex_replace('^https://') }}
    include_role: 
      name: get_ppdm_token
    vars: 
      ppdm_password: "{{ ppdm_new_password }}"
  - debug:
      msg: "{{ get_ppdm_token_access_token }}"
      verbosity: 1
    name: do we have a token ?
  - name: get Update Package
    include_role:
      name: get_ppdm_update_package
    vars:
      get_ppdm_update_package_filter: 'category eq "ACTIVE"'

  - name: get_ppdm_upgrade_by ID
    when: get_ppdm_update_package_update_package[0] is defined and get_ppdm_update_package_update_package[0].upgradeError is not defined
    include_role:
      name: get_ppdm_update_package
    vars:
      get_ppdm_update_package_id: "{{ get_ppdm_update_package_update_package[0].id }}"

  - name: merge update body
    vars:
      my_new_config:
        state: INSTALLED
        certificateTrustedByUser: true
        eula:
          productEulaAccepted: true # honor EULA Changes
          telemetryEulaAccepted: true  # honor EULA Changes
        sizeInBytes:  "{{ get_ppdm_update_package_update_package.sizeInBytes | int }}"
    set_fact:
      get_ppdm_update_package_update_package: "{{ get_ppdm_update_package_update_package | default([]) | combine(my_new_config, recursive=True) }}"
  - debug:
      msg: "{{ get_ppdm_update_package_update_package }}"
  - name: install_ppdm_upgrade
    when: get_ppdm_update_package_update_package is defined and get_ppdm_update_package_update_package.state == "INSTALLED"
    include_role:
      name: install_ppdm_update_package
    vars:
      id: "{{ get_ppdm_update_package_update_package.id }}"
      body: "{{ get_ppdm_update_package_update_package }}"
  - name: Validate Update Started
    when: get_ppdm_update_package_update_package is defined and get_ppdm_update_package_update_package.upgradeError is not defined
    include_role:
      name: get_ppdm_update_package
    vars:
      id: "{{ get_ppdm_update_package_update_package.id }}"
  - name: Check Update State  https://{{ ppdm_fqdn | regex_replace('^https://') }}
    include_role:
      name: check_update_done             
            