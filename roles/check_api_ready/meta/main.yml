galaxy_info:
  role_name: check_api_ready
  author: Karsten Bott, Dell Technologies
  description: Check if PPDM API is ready for requests
  company: Dell Technologies
  license: MIT
  min_ansible_version: 2.9
  platforms:
    - name: EL
      versions:
        - 7
        - 8
        - 9
    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
    - name: Debian
      versions:
        - buster
        - bullseye
    - name: GenericLinux
      versions:
        - any
  galaxy_tags:
    - ppdm
    - powerprotect
    - dell
    - backup
    - recovery
    - storage
    - protection
    - health-check

dependencies: []

description: |
  This role checks if the PPDM API is ready to accept requests.

ppdm_api:
  version: "20.3.0"
  endpoint: /api/v2
  method: GET

variables:
  required:
    - name: ppdm_baseurl
      type: string
      description: The base URL of the PPDM server
      default: null
    - name: ppdm_port
      type: integer
      description: The port number for the PPDM API
      default: 8443
    - name: ppdm_api_ver
      type: string
      description: The API version path
      default: /api/v2

output_variables:
  - name: result
    type: object
    description: The full API response

examples:
  - name: Check API ready
    code: |
      - name: Check if PPDM API is ready
        include_role:
          name: check_api_ready
        vars:
          ppdm_baseurl: "https://ppdm.example.com"
