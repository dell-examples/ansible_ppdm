- name: Define uri with license ID
  set_fact:
    get_ppdm_licenses_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/licenses/{{ get_ppdm_licenses_id }}"
  when: get_ppdm_licenses_id | default('', true) | trim != ''
- name: Define uri without license id
  set_fact:
    get_ppdm_licenses_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/licenses"
  when: get_ppdm_licenses_id | default('', false) | trim == ''
- name: Get PPDM licenses with status {{ get_ppdm_licenses_condition }}
  uri:
    method: GET
    url: "{{ get_ppdm_licenses_uri }}"
    body_format: json
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 200,500
    validate_certs: false
  register: get_ppdm_licenses_result
  until: "{{ get_ppdm_licenses_condition }}"
  retries: "{{ get_ppdm_licenses_retries }}"
  delay: "{{ get_ppdm_licenses_delay }}"
  when: not ansible_check_mode
- set_fact:
    get_ppdm_licenses_licenses: "{{ get_ppdm_licenses_result.json.content }}"
- debug:
    msg: "{{ get_ppdm_licenses_licenses[0].id }}"
    verbosity: 0    
