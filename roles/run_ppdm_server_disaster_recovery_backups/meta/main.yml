galaxy_info:
  role_name: run_ppdm_server_disaster_recovery_backups
  author: Karsten Bott, Dell Technologies
  description: Run server disaster recovery backups in PowerProtect Data Manager (PPDM) using the REST API
  company: Dell Technologies
  license: MIT
  min_ansible_version: 2.9
  platforms:
    - name: EL
      versions:
        - 7
        - 8
        - 9
    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
    - name: Debian
      versions:
        - buster
        - bullseye
    - name: GenericLinux
      versions:
        - any
  galaxy_tags:
    - ppdm
    - powerprotect
    - dell
    - backup
    - recovery
    - storage
    - protection
    - disaster-recovery
    - sdr

dependencies: []

ppdm_api:
  version: "20.3.0"
  endpoint: /api/v2/server-disaster-recovery-backups
  method: POST

variables:
  required:
    - name: ppdm_baseurl
      type: string
      description: The base URL of the PPDM server
      default: null
    - name: ppdm_port
      type: integer
      description: The port number for the PPDM API
      default: 8443
    - name: ppdm_api_ver
      type: string
      description: The API version path
      default: /api/v2
    - name: access_token
      type: string
      description: The PPDM access token for authentication
      default: null
    - name: data
      type: dictionary
      description: The server disaster recovery backup data
      default: null

output_variables:
  - name: result
    type: object
    description: The full API response

examples:
  - name: Run server disaster recovery backups
    code: |
      - name: Run server disaster recovery backups
        include_role:
          name: run_ppdm_server_disaster_recovery_backups
        vars:
          ppdm_baseurl: "https://ppdm.example.com"
          access_token: "{{ ppdm_token }}"
          data:
            configurationId: "12345678-1234-1234-1234-123456789012"
