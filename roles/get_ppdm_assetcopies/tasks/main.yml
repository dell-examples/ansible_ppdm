- name: Define uri with assets ID
  set_fact:
    get_ppdm_assetcopies_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/assets/{{ get_ppdm_assetcopies_id }}/copies"
- name: Rewrite uri with filter
  set_fact:
    get_ppdm_assetcopies_uri: "{{ get_ppdm_assetcopies_uri }}?filter={{ get_ppdm_assetcopies_filter | string | urlencode }}"
  when: get_ppdm_assetcopies_filter | default('', true) | trim != ''

- name: Get PPDM assetcopies with status {{ get_ppdm_assetcopies_condition }}
  uri:
    method: GET
    url: "{{ get_ppdm_assetcopies_uri }}"
    body_format: json
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 200,500
    validate_certs: false
  register: get_ppdm_assetcopies_result
  until: "{{ get_ppdm_assetcopies_condition }}"
  retries: "{{ get_ppdm_assetcopies_retries }}"
  delay: "{{ get_ppdm_assetcopies_delay }}"
  when: not ansible_check_mode
- set_fact:
    get_ppdm_assetcopies_copies: "{{ get_ppdm_assetcopies_result.json.content }}"
- debug:
    msg: "{{ get_ppdm_assetcopies_copies }}"
    verbosity: 1    
