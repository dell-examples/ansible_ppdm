galaxy_info:
  role_name: get_ppdm_asset_setting
  author: Karsten Bott, Dell Technologies
  description: Retrieve asset settings from PowerProtect Data Manager (PPDM) using the REST API
  company: Dell Technologies
  license: MIT
  min_ansible_version: 2.9
  platforms:
    - name: EL
      versions:
        - 7
        - 8
        - 9
    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
    - name: Debian
      versions:
        - buster
        - bullseye
    - name: GenericLinux
      versions:
        - any
  galaxy_tags:
    - ppdm
    - powerprotect
    - dell
    - backup
    - recovery
    - storage
    - protection
    - assets
    - settings

dependencies: []

ppdm_api:
  version: "20.3.0"
  endpoint: /api/v2/asset-settings
  method: GET

variables:
  required:
    - name: ppdm_baseurl
      type: string
      description: The base URL of the PPDM server
      default: null
    - name: ppdm_port
      type: integer
      description: The port number for the PPDM API
      default: 8443
    - name: ppdm_api_ver
      type: string
      description: The API version path
      default: /api/v2
    - name: access_token
      type: string
      description: The PPDM access token for authentication
      default: null

output_variables:
  - name: get_ppdm_asset_setting_asset_setting
    type: object
    description: The asset setting retrieved from PPDM
  - name: get_ppdm_asset_setting_result
    type: object
    description: The full API response

examples:
  - name: Get asset settings
    code: |
      - name: Get PPDM asset settings
        include_role:
          name: get_ppdm_asset_setting
        vars:
          ppdm_baseurl: "https://ppdm.example.com"
          access_token: "{{ ppdm_token }}"
