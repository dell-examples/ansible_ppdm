galaxy_info:
  role_name: set_ppdm_credentials
  author: Karsten Bott, Dell Technologies
  description: Update existing credentials in PowerProtect Data Manager (PPDM) using the REST API
  company: Dell Technologies
  license: MIT
  min_ansible_version: 2.9
  platforms:
    - name: EL
      versions:
        - 7
        - 8
        - 9
    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
    - name: Debian
      versions:
        - buster
        - bullseye
    - name: GenericLinux
      versions:
        - any
  galaxy_tags:
    - ppdm
    - powerprotect
    - dell
    - backup
    - recovery
    - storage
    - protection
    - credentials
    - authentication

dependencies: []

ppdm_api:
  version: "20.3.0"
  endpoint: /api/v2/credentials/{id}
  method: PUT

variables:
  required:
    - name: ppdm_baseurl
      type: string
      description: The base URL of the PPDM server
      default: null
    - name: ppdm_port
      type: integer
      description: The port number for the PPDM API
      default: 8443
    - name: ppdm_api_ver
      type: string
      description: The API version path
      default: /api/v2
    - name: access_token
      type: string
      description: The PPDM access token for authentication
      default: null
    - name: id
      type: string
      description: The ID of the credential to update
      default: null
    - name: data
      type: dictionary
      description: The updated credential data
      default: null

output_variables:
  - name: credentials
    type: object
    description: The updated credential object
  - name: result
    type: object
    description: The full API response

examples:
  - name: Update credentials
    code: |
      - name: Update credential
        include_role:
          name: set_ppdm_credentials
        vars:
          ppdm_baseurl: "https://ppdm.example.com"
          access_token: "{{ ppdm_token }}"
          id: "{{ credential_id }}"
          data:
            password: "{{ new_password }}"
