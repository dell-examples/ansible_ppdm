- name: Define Uri
  set_fact:
    restore_ppdm_k8s_copies_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/restored-copies"
- name: Rewrite uri with filter
  set_fact:
    restore_ppdm_k8s_copies_uri: "{{ restore_ppdm_k8s_copies_uri }}?filter={{ restore_ppdm_k8s_copies_filter | string | urlencode }}"
  when: restore_ppdm_k8s_copies_filter | default('', true) | trim != ''

- name: restore asset copies to a namespace with existing class
  vars:
    patch:
      name: "*"
  uri:
    method: POST
    url: "{{ restore_ppdm_k8s_copies_uri }}"
    body_format: json
    body:
      description: "Restore Namespace {{ asset.name }} {{ restoreType }} {{ target_namespace }} from copy id {{ copy.id }}, created {{ copy.createTime }} {{ message }}"
      restoreType: "{{ restoreType }}"
      copyIds:
        - "{{ copy.id }}"
      restoredCopiesDetails:
        targetK8sInfo:
          namespace: "{{ target_namespace }}"
          skipNamespaceResources: false
          targetInventorySourceId: "{{ asset.details.k8s.inventorySourceId }}"
          persistentVolumeClaims:
           - "{{ copy.details.k8sBackup.persistentVolumeClaims | reject('search','storageClass')  | combine(patch, recursive=True) }}"
          overwritePersistentVolumeClaim: true
      options:
        includeClusterResources: false
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 201,200,500
    validate_certs: false
  register: restore_ppdm_k8s_copies_result
  until: "{{ restore_ppdm_k8s_copies_condition }}"
  retries: "{{ restore_ppdm_k8s_copies_retries }}"
  delay: "{{ restore_ppdm_k8s_copies_delay }}"
  when: not ansible_check_mode and alternate_storageclass is not defined
- set_fact:
    restore_ppdm_k8s_copies_restore: "{{ restore_ppdm_k8s_copies_result.json }}"
  when: not ansible_check_mode and alternate_storageclass is not defined
- name: restore asset copies to a namespace with alternate class
  vars:
    patch:
      alternateStorageClass: "{{ alternate_storageclass }}"
      name: "*"
  uri:
    method: POST
    url: "{{ restore_ppdm_k8s_copies_uri }}"
    body_format: json
    body:
      description: "Restore Namespace {{ asset.name }} {{ restoreType }} {{ target_namespace }} from copy id {{ copy.id }}, created {{ copy.createTime }} {{ message }}"
      restoreType: "{{ restoreType }}"
      copyIds:
        - "{{ copy.id }}"
      restoredCopiesDetails:
        targetK8sInfo:
          namespace: "{{ target_namespace }}"
          skipNamespaceResources: false
          targetInventorySourceId: "{{ asset.details.k8s.inventorySourceId }}"
          persistentVolumeClaims:
           - "{{ copy.details.k8sBackup.persistentVolumeClaims | reject('search','storageClass')  | combine(patch, recursive=True) }}"
          overwritePersistentVolumeClaim: true
      options:
        includeClusterResources: false
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 201,200,500
    validate_certs: false
  register: restore_ppdm_k8s_copies_result
  until: "{{ restore_ppdm_k8s_copies_condition }}"
  retries: "{{ restore_ppdm_k8s_copies_retries }}"
  delay: "{{ restore_ppdm_k8s_copies_delay }}"
  when: not ansible_check_mode and alternate_storageclass is defined
- set_fact:
    restore_ppdm_k8s_copies_restore: "{{ restore_ppdm_k8s_copies_result.json }}"
  when: not ansible_check_mode and alternate_storageclass is defined
- debug:
    msg: "{{ restore_ppdm_k8s_copies_restore }}"
    verbosity: 1    
