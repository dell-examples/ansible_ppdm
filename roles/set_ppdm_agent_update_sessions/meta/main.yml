galaxy_info:
  role_name: set_ppdm_agent_update_sessions
  author: Karsten Bott, Dell Technologies
  description: Set agent update sessions in PowerProtect Data Manager (PPDM) using the REST API
  company: Dell Technologies
  license: MIT
  min_ansible_version: 2.9
  platforms:
    - name: EL
      versions:
        - 7
        - 8
        - 9
    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
    - name: Debian
      versions:
        - buster
        - bullseye
    - name: GenericLinux
      versions:
        - any
  galaxy_tags:
    - ppdm
    - powerprotect
    - dell
    - backup
    - recovery
    - storage
    - protection
    - agents
    - update

dependencies: []

ppdm_api:
  version: "20.3.0"
  endpoint: /api/v2/agents-update-sessions
  method: POST

variables:
  required:
    - name: ppdm_baseurl
      type: string
      description: The base URL of the PPDM server
      default: null
    - name: ppdm_port
      type: integer
      description: The port number for the PPDM API
      default: 8443
    - name: ppdm_api_ver
      type: string
      description: The API version path
      default: /api/v2
    - name: access_token
      type: string
      description: The PPDM access token for authentication
      default: null
    - name: data
      type: dictionary
      description: The agent update session data
      default: null

output_variables:
  - name: result
    type: object
    description: The full API response

examples:
  - name: Set agent update sessions
    code: |
      - name: Set agent update sessions
        include_role:
          name: set_ppdm_agent_update_sessions
        vars:
          ppdm_baseurl: "https://ppdm.example.com"
          access_token: "{{ ppdm_token }}"
          data:
            agentIds: ["12345678-1234-1234-1234-123456789012"]
