- name: Define uri with agents-agents-update-sessions ID
  set_fact:
    wait_ppdm_agents_update_sessions_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/agents-update-sessions/{{ wait_ppdm_agents_update_sessions_id }}"
  when: wait_ppdm_agents_update_sessions_id | default('', true) | trim != ''
- name: Define uri without agents-update-sessions id
  set_fact:
    wait_ppdm_agents_update_sessions_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/agents-update-sessions"
  when: wait_ppdm_agents_update_sessions_id | default('', false) | trim == ''
- name: Rewrite uri with filter
  set_fact:
    wait_ppdm_agents_update_sessions_uri: "{{ wait_ppdm_agents_update_sessions_uri }}?filter={{ wait_ppdm_agents_update_sessions_filter | string | urlencode }}"
  when: wait_ppdm_agents_update_sessions_filter | default('', true) | trim != ''

- name: Get PPDM agents-update-sessions
  uri:
    method: GET
    url: "{{ wait_ppdm_agents_update_sessions_uri }}"
    body_format: json
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 200,500
    validate_certs: false
  register: wait_ppdm_agents_update_sessions_result
  when:
    - not ansible_check_mode
    - wait_ppdm_agents_update_sessions_id is defined
  until: wait_ppdm_agents_update_sessions_result.json is defined and wait_ppdm_agents_update_sessions_result.json.state == "COMPLETED"
  retries: "{{ wait_ppdm_agents_update_sessions_retry }}"
  delay: "{{ wait_ppdm_agents_update_sessions_wait }}"
- debug:
    msg: "{{ wait_ppdm_agents_update_sessions_result.json }}"
    verbosity: 1
- set_fact:
    wait_ppdm_agents_update_sessions_agents_update_sessions: "{{ wait_ppdm_agents_update_sessions_result.json }}"
  when: wait_ppdm_agents_update_sessions_id | default('', true) | trim != '' and wait_ppdm_agents_update_sessions_result.json is defined
- debug:
    msg: "{{ wait_ppdm_agents_update_sessions_agents_update_sessions }}"
    verbosity: 1   

