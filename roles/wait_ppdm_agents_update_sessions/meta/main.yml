galaxy_info:
  role_name: wait_ppdm_agents_update_sessions
  author: Karsten Bott, Dell Technologies
  description: Wait for PPDM agents update sessions to complete
  company: Dell Technologies
  license: MIT
  min_ansible_version: 2.9
  platforms:
    - name: EL
      versions:
        - 7
        - 8
        - 9
    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
    - name: Debian
      versions:
        - buster
        - bullseye
    - name: GenericLinux
      versions:
        - any
  galaxy_tags:
    - ppdm
    - powerprotect
    - dell
    - backup
    - recovery
    - storage
    - protection
    - agents
    - update

dependencies: []

description: |
  This role waits for PPDM agents update sessions to complete.

ppdm_api:
  version: "20.3.0"
  endpoint: /api/v2/agents-update-sessions
  method: GET

variables:
  required:
    - name: ppdm_baseurl
      type: string
      description: The base URL of the PPDM server
      default: null
    - name: ppdm_port
      type: integer
      description: The port number for the PPDM API
      default: 8443
    - name: ppdm_api_ver
      type: string
      description: The API version path
      default: /api/v2
    - name: access_token
      type: string
      description: The PPDM access token for authentication
      default: null
  optional:
    - name: wait_ppdm_agents_update_sessions_delay
      type: integer
      description: Delay between retries in seconds
      default: 10
    - name: wait_ppdm_agents_update_sessions_retries
      type: integer
      description: Number of retries
      default: 60

output_variables:
  - name: result
    type: object
    description: The full API response

examples:
  - name: Wait for agents update sessions
    code: |
      - name: Wait for agents update sessions
        include_role:
          name: wait_ppdm_agents_update_sessions
        vars:
          ppdm_baseurl: "https://ppdm.example.com"
          access_token: "{{ ppdm_token }}"
