- name: Define uri with Credential ID
  set_fact:
    get_ppdm_nodes_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/nodes/{{ get_ppdm_nodes_id }}"
  when: get_ppdm_nodes_id | default('', true) | trim != ''
- name: Define uri without Credential id
  set_fact:
    get_ppdm_nodes_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/nodes"
  when: get_ppdm_nodes_id | default('', false) | trim == ''
- name: Rewrite uri with filter
  set_fact:
    get_ppdm_nodes_uri: "{{ get_ppdm_nodes_uri }}?filter={{ get_ppdm_nodes_filter | string | urlencode }}"
  when: get_ppdm_nodes_filter | default('', true) | trim != ''
- name: Get PPDM nodes with filter {{ get_ppdm_nodes_filter }}
  uri:
    method: GET
    url: "{{ get_ppdm_nodes_uri }}"
    body_format: json
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 200,500,503
    validate_certs: false
  register: get_ppdm_nodes_result
  when: not ansible_check_mode
- set_fact:
    get_ppdm_nodes_nodes: "{{ get_ppdm_nodes_result.json.content }}"
  when: get_ppdm_nodes_result.json.content[0].id is defined and get_ppdm_nodes_result.status == 200
- set_fact:
    get_ppdm_nodes_nodes: "{{ get_ppdm_nodes_result.json }}"
  when: get_ppdm_nodes_result.json is defined and get_ppdm_nodes_result.status == 200 and get_ppdm_nodes_id is defined
- debug:
    msg: "{{ get_ppdm_nodes_nodes }}"
    verbosity: 1
  when: get_ppdm_nodes_nodes is defined  