galaxy_info:
  role_name: create_ppdm_credentials
  author: Karsten Bott, Dell Technologies
  description: Create or update credentials in PowerProtect Data Manager (PPDM) using the REST API
  company: Dell Technologies
  license: MIT
  min_ansible_version: 2.9
  platforms:
    - name: EL
      versions:
        - 7
        - 8
        - 9
    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
    - name: Debian
      versions:
        - buster
        - bullseye
    - name: GenericLinux
      versions:
        - any
  galaxy_tags:
    - ppdm
    - powerprotect
    - dell
    - backup
    - recovery
    - storage
    - protection
    - credentials
    - authentication

dependencies:
  - get_ppdm_credentials
  - set_ppdm_credentials

description: |
  This role creates or updates credentials in PowerProtect Data Manager (PPDM) via the REST API.
  It first checks if credentials with the same name exist, and if so, updates them. Otherwise,
  it creates new credentials. The role supports various credential types including VCENTER,
  DATADOMAIN, KUBERNETES, and CLOUD_SNAPSHOT_MANAGER.

ppdm_api:
  version: "20.3.0"
  endpoint: /api/v2/credentials
  method: POST

variables:
  required:
    - name: ppdm_baseurl
      type: string
      description: The base URL of the PPDM server
      default: null
    - name: ppdm_port
      type: integer
      description: The port number for the PPDM API
      default: 8443
    - name: ppdm_api_ver
      type: string
      description: The API version path
      default: /api/v2
    - name: access_token
      type: string
      description: The PPDM access token for authentication
      default: null
    - name: data
      type: dictionary
      description: The credential data including name, type, username, password, and other properties
      default: null

output_variables:
  - name: credentials
    type: object
    description: The created or updated credential object
  - name: result
    type: object
    description: The full API response

examples:
  - name: Create vCenter credentials
    code: |
      - name: Create vCenter credentials
        include_role:
          name: create_ppdm_credentials
        vars:
          ppdm_baseurl: "https://ppdm.example.com"
          access_token: "{{ ppdm_token }}"
          data:
            type: "VCENTER"
            name: "my-vcenter"
            username: "administrator@vsphere.local"
            password: "{{ vcenter_password }}"
