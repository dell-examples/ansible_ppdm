- name: Define uri with package ID
  set_fact:
    get_ppdm_update_package_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/upgrade-packages/{{ get_ppdm_update_package_id }}"
  when: get_ppdm_update_package_id | default('', true) | trim != ''
- name: Define uri without package id
  set_fact:
    get_ppdm_update_package_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/upgrade-packages"
  when: get_ppdm_update_package_id | default('', false) | trim == ''
- name: Rewrite uri with filter
  set_fact:
    get_ppdm_update_package_uri: "{{ get_ppdm_update_package_uri }}?filter={{ get_ppdm_update_package_filter | string | urlencode }}"
  when: get_ppdm_update_package_filter | default('', true) | trim != ''
- name: Getting Upgrade Package State
  uri:
    method: GET
    url: "{{ get_ppdm_update_package_uri }}"
    body_format: json
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 200,202,403
    validate_certs: false
  register: get_ppdm_update_package_result
  when: not ansible_check_mode
- set_fact:
    get_ppdm_update_package_update_package: "{{ get_ppdm_update_package_result.json.content }}"
  when: get_ppdm_update_package_id | default('', false) | trim == ''
- set_fact:
    get_ppdm_update_package_update_package: "{{ get_ppdm_update_package_result.json }}"
  when: get_ppdm_update_package_id | default('', true) | trim != ''
- debug:
    msg: "{{ get_ppdm_update_package_update_package }}"
    verbosity: 1