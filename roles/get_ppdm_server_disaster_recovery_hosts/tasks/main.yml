- name: Define uri with id
  set_fact:
    get_ppdm_server_disaster_recovery_hosts_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/server-disaster-recovery-hosts/{{ get_ppdm_server_disaster_recovery_hosts_id }}"
  when: get_ppdm_server_disaster_recovery_hosts_id | default('', true) | trim != ''
- name: Define uri without id
  set_fact:
    get_ppdm_server_disaster_recovery_hosts_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/server-disaster-recovery-hosts"
  when: get_ppdm_server_disaster_recovery_hosts_id | default('', false) | trim == ''
- name: Rewrite uri with filter
  set_fact:
    get_ppdm_server_disaster_recovery_hosts_uri: "{{ get_ppdm_server_disaster_recovery_hosts_uri }}?filter={{ get_ppdm_server_disaster_recovery_hosts_filter | string | urlencode }}"
  when: get_ppdm_server_disaster_recovery_hosts_filter | default('', true) | trim != ''
- name: Get PPDM Server Disaster Recovery Hosts with filter {{ get_ppdm_server_disaster_recovery_hosts_filter }}
  uri:
    method: GET
    url: "{{ get_ppdm_server_disaster_recovery_hosts_uri }}"
    body_format: json
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 200,500,503
    validate_certs: false
  register: get_ppdm_server_disaster_recovery_hosts_result
  when: not ansible_check_mode
- set_fact:
    get_ppdm_server_disaster_recovery_hosts_server_disaster_recovery_hosts: "{{ get_ppdm_server_disaster_recovery_hosts_result.json.content }}"
  when: get_ppdm_server_disaster_recovery_hosts_result.json.content[0].id is defined and get_ppdm_server_disaster_recovery_hosts_result.status == 200
- set_fact:
    get_ppdm_server_disaster_recovery_hosts_server_disaster_recovery_hosts: "{{ get_ppdm_server_disaster_recovery_hosts_result.json }}"
  when: get_ppdm_server_disaster_recovery_hosts_result.json is defined and get_ppdm_server_disaster_recovery_hosts_result.status == 200 and get_ppdm_server_disaster_recovery_hosts_id is defined
- debug:
    msg: "{{ get_ppdm_server_disaster_recovery_hosts_server_disaster_recovery_hosts }}"
    verbosity: 1
  when: get_ppdm_server_disaster_recovery_hosts_server_disaster_recovery_hosts is defined  