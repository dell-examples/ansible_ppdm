- name: Get PPDM Host Certificate for {{ get_ppdm_host_certificate_host }}
  ansible.builtin.uri:
    method: GET
    url: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/certificates?host={{ get_ppdm_host_certificate_host }}&port={{ get_ppdm_host_certificate_port }}&type=Host"
    body_format: json
    headers:
      accept: application/json
      authorization: "Bearer {{ get_ppdm_token_access_token }}"
    status_code: 200
    validate_certs: false
  register: get_ppdm_host_certificate_result
  when: not ansible_check_mode
- debug:
    msg: "{{ get_ppdm_host_certificate_result.json }}"
    verbosity: 1
- name: return certificate
  set_fact:
    get_ppdm_host_certificate_certificate: "{{ get_ppdm_host_certificate_result.json[0] if get_ppdm_host_certificate_result.json is iterable and get_ppdm_host_certificate_result.json is not string else get_ppdm_host_certificate_result.json }}"
