- name: Define uri with vib-details ID
  set_fact:
    get_ppdm_vibs_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/vib-details?parentResourceId={{ get_ppdm_vibs_id }}"
#  when: get_ppdm_vibs_id | default('', true) | trim != ''

- name: Get PPDM vib-details with status {{ get_ppdm_vibs_condition }}
  uri:
    method: GET
    url: "{{ get_ppdm_vibs_uri }}"
    body_format: json
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 200,500
    validate_certs: false
  register: get_ppdm_vibs_result
  until: "{{ get_ppdm_vibs_condition }}"
  retries: "{{ get_ppdm_vibs_retries }}"
  delay: "{{ get_ppdm_vibs_delay }}"
  when: not ansible_check_mode
- set_fact:
    get_ppdm_vibs_vibdetails: "{{ get_ppdm_vibs_result.json.content }}"
- debug:
    msg: "{{ get_ppdm_vibs_vibdetails }}"
    verbosity: 0    
