galaxy_info:
  role_name: add_ppdm_certificate_chain
  author: Karsten Bott, Dell Technologies
  description: Add certificate chain to PowerProtect Data Manager (PPDM) using the REST API
  company: Dell Technologies
  license: MIT
  min_ansible_version: 2.9
  platforms:
    - name: EL
      versions:
        - 7
        - 8
        - 9
    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
    - name: Debian
      versions:
        - buster
        - bullseye
    - name: GenericLinux
      versions:
        - any
  galaxy_tags:
    - ppdm
    - powerprotect
    - dell
    - backup
    - recovery
    - storage
    - protection
    - certificates
    - ssl

dependencies: []

ppdm_api:
  version: "20.3.0"
  endpoint: /api/v2/certificate-chain
  method: POST

variables:
  required:
    - name: ppdm_baseurl
      type: string
      description: The base URL of the PPDM server
      default: null
    - name: ppdm_port
      type: integer
      description: The port number for the PPDM API
      default: 8443
    - name: ppdm_api_ver
      type: string
      description: The API version path
      default: /api/v2
    - name: access_token
      type: string
      description: The PPDM access token for authentication
      default: null
    - name: chain
      type: string
      description: The certificate chain to add
    - name: host
      type: string
      description: The hostname for the certificate chain

output_variables:
  - name: result
    type: object
    description: The full API response

examples:
  - name: Add certificate chain
    code: |
      - name: Add certificate chain
        include_role:
          name: add_ppdm_certificate_chain
        vars:
          ppdm_baseurl: "https://ppdm.example.com"
          access_token: "{{ ppdm_token }}"
          chain: "{{ certificate_chain }}"
          host: "k8s.example.com"
