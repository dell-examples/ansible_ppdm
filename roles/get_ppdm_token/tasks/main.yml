- name: Get PPDM Token
  uri:
    method: POST
    url: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/login"
    body:
      username: "{{ ppdm_username }}"
      password: "{{ ppdm_password }}"
    body_format: json
    status_code: 200
    validate_certs: false
  register: get_ppdm_token_result
  when: not ansible_check_mode
- set_fact:
    get_ppdm_token_access_token: "{{ get_ppdm_token_result.json.access_token }}"
