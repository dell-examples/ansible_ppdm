galaxy_info:
  role_name: start_adhoc_ppdm_protections
  author: Karsten Bott, Dell Technologies
  description: Start adhoc protections in PowerProtect Data Manager (PPDM) using the REST API
  company: Dell Technologies
  license: MIT
  min_ansible_version: 2.9
  platforms:
    - name: EL
      versions:
        - 7
        - 8
        - 9
    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
    - name: Debian
      versions:
        - buster
        - bullseye
    - name: GenericLinux
      versions:
        - any
  galaxy_tags:
    - ppdm
    - powerprotect
    - dell
    - backup
    - recovery
    - storage
    - protection

dependencies: []

ppdm_api:
  version: "20.3.0"
  endpoint: /api/v2/adhoc-protections
  method: POST

variables:
  required:
    - name: ppdm_baseurl
      type: string
      description: The base URL of the PPDM server
      default: null
    - name: ppdm_port
      type: integer
      description: The port number for the PPDM API
      default: 8443
    - name: ppdm_api_ver
      type: string
      description: The API version path
      default: /api/v2
    - name: access_token
      type: string
      description: The PPDM access token for authentication
      default: null
    - name: data
      type: dictionary
      description: The adhoc protection data
      default: null

output_variables:
  - name: result
    type: object
    description: The full API response

examples:
  - name: Start adhoc protections
    code: |
      - name: Start adhoc protections
        include_role:
          name: start_adhoc_ppdm_protections
        vars:
          ppdm_baseurl: "https://ppdm.example.com"
          access_token: "{{ ppdm_token }}"
          data:
            assetId: "12345678-1234-1234-1234-123456789012"
