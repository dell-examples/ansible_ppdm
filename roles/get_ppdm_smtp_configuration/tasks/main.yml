- name: Define uri with SMTP ID
  set_fact:
    get_ppdm_smtp_configuration_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/smtp/{{ get_ppdm_smtp_configuration_id }}"
  when: get_ppdm_smtp_configuration_id | default('', true) | trim != ''
- name: Define uri without SMTP id
  set_fact:
    get_ppdm_smtp_configuration_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/smtp"
  when: get_ppdm_smtp_configuration_id | default('', false) | trim == ''
- name: Get PPDM SMTP Configuration
  uri:
    method: GET
    url: "{{ get_ppdm_smtp_configuration_uri }}"
    body_format: json
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 200,500
    validate_certs: false
  register: get_ppdm_smtp_configuration_result
  when: not ansible_check_mode
- set_fact:
    get_ppdm_smtp_configuration_smtp_configuration: "{{ get_ppdm_smtp_configuration_result.json.content }}"
