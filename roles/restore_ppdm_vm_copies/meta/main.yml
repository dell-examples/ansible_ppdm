galaxy_info:
  role_name: restore_ppdm_vm_copies
  author: Karsten Bott, Dell Technologies
  description: Restore VM asset copies using PowerProtect Data Manager (PPDM) REST API
  company: Dell Technologies
  license: MIT
  min_ansible_version: 2.9
  platforms:
    - name: EL
      versions:
        - 7
        - 8
        - 9
    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
    - name: Debian
      versions:
        - buster
        - bullseye
    - name: GenericLinux
      versions:
        - any
  galaxy_tags:
    - ppdm
    - powerprotect
    - dell
    - backup
    - recovery
    - storage
    - protection
    - vmware
    - restore

dependencies: []

description: |
  This role restores VM asset copies using PowerProtect Data Manager (PPDM) via the REST API.

ppdm_api:
  version: "20.3.0"
  endpoint: /api/v2/vm-asset-copies/{id}/restore
  method: POST

variables:
  required:
    - name: ppdm_baseurl
      type: string
      description: The base URL of the PPDM server
      default: null
    - name: ppdm_port
      type: integer
      description: The port number for the PPDM API
      default: 8443
    - name: ppdm_api_ver
      type: string
      description: The API version path
      default: /api/v2
    - name: access_token
      type: string
      description: The PPDM access token for authentication
      default: null
    - name: id
      type: string
      description: The VM asset copy ID to restore
      default: null
    - name: data
      type: dictionary
      description: The restore data
      default: null

output_variables:
  - name: result
    type: object
    description: The full API response

examples:
  - name: Restore VM asset copies
    code: |
      - name: Restore VM asset copies
        include_role:
          name: restore_ppdm_vm_copies
        vars:
          ppdm_baseurl: "https://ppdm.example.com"
          access_token: "{{ ppdm_token }}"
          id: "{{ asset_copy_id }}"
          data:
            targetVmAssetId: "87654321-4321-4321-4321-210987654321"
