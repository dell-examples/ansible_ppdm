- name: Define uri with id
  set_fact:
    get_ppdm_server_disaster_recovery_backups_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/server-disaster-recovery-backups/{{ get_ppdm_server_disaster_recovery_backups_id }}"
  when: get_ppdm_server_disaster_recovery_backups_id | default('', true) | trim != ''
- name: Define uri without id
  set_fact:
    get_ppdm_server_disaster_recovery_backups_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/server-disaster-recovery-backups"
  when: get_ppdm_server_disaster_recovery_backups_id | default('', false) | trim == ''
- name: Rewrite uri with filter
  set_fact:
    get_ppdm_server_disaster_recovery_backups_uri: "{{ get_ppdm_server_disaster_recovery_backups_uri }}?filter={{ get_ppdm_server_disaster_recovery_backups_filter | string | urlencode }}" #&{{ query | string | urlencode }}"
  when: get_ppdm_server_disaster_recovery_backups_filter | default('', true) | trim != ''
- name: Get PPDM Server Disaster Recovery Backups with filter {{ get_ppdm_server_disaster_recovery_backups_filter }}
  uri:
    method: GET
    url: "{{ get_ppdm_server_disaster_recovery_backups_uri }}"
    body_format: json
    body:
      full: TRUE
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 200,500,503
    validate_certs: false
  register: get_ppdm_server_disaster_recovery_backups_result
  when: not ansible_check_mode
- set_fact:
    get_ppdm_server_disaster_recovery_backups_server_disaster_recovery_backups: "{{ get_ppdm_server_disaster_recovery_backups_result.json.content }}"
  when: get_ppdm_server_disaster_recovery_backups_result.json.content[0].id is defined and get_ppdm_server_disaster_recovery_backups_result.status == 200
- set_fact:
    get_ppdm_server_disaster_recovery_backups_server_disaster_recovery_backups: "{{ get_ppdm_server_disaster_recovery_backups_result.json }}"
  when: get_ppdm_server_disaster_recovery_backups_result.json is defined and get_ppdm_server_disaster_recovery_backups_result.status == 200 and get_ppdm_server_disaster_recovery_backups_id is defined
- debug:
    msg: "{{ get_ppdm_server_disaster_recovery_backups_server_disaster_recovery_backups }}"
    verbosity: 1
  when: get_ppdm_server_disaster_recovery_backups_server_disaster_recovery_backups is defined  