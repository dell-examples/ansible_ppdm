- name: Define uri with agents-agents-update-sessions ID
  set_fact:
    get_ppdm_agents_update_sessions_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/agents-update-sessions/{{ get_ppdm_agents_update_sessions_id }}"
  when: get_ppdm_agents_update_sessions_id | default('', true) | trim != ''
- name: Define uri without agents-update-sessions id
  set_fact:
    get_ppdm_agents_update_sessions_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/agents-update-sessions"
  when: get_ppdm_agents_update_sessions_id | default('', false) | trim == ''
- name: Rewrite uri with filter
  set_fact:
    get_ppdm_agents_update_sessions_uri: "{{ get_ppdm_agents_update_sessions_uri }}?filter={{ get_ppdm_agents_update_sessions_filter | string | urlencode }}"
  when: get_ppdm_agents_update_sessions_filter | default('', true) | trim != ''

- name: Get PPDM agents-update-sessions
  uri:
    method: GET
    url: "{{ get_ppdm_agents_update_sessions_uri }}"
    body_format: json
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 200,500
    validate_certs: false
  register: get_ppdm_agents_update_sessions_result
  when: not ansible_check_mode
- set_fact:
    get_ppdm_agents_update_sessions_agents_update_sessions: "{{ get_ppdm_agents_update_sessions_result.json.content }}"
  when: get_ppdm_agents_update_sessions_result.json.content is defined
- set_fact:
    get_ppdm_agents_update_sessions_agents_update_sessions: "{{ get_ppdm_agents_update_sessions_result.json }}"
  when: get_ppdm_agents_update_sessions_id | default('', true) | trim != '' and get_ppdm_agents_update_sessions_result.json is defined
- debug:
    msg: "{{ get_ppdm_agents_update_sessions_agents_update_sessions }}"
    verbosity: 1    