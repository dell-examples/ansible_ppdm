- name: Define uri with Component ID
  set_fact:
    get_ppdm_components_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/components/{{ get_ppdm_components_id }}"
  when: get_ppdm_components_id | default('', true) | trim != ''
- name: Define uri without Component id
  set_fact:
    get_ppdm_components_uri: "{{ ppdm_baseurl }}:{{ ppdm_port }}{{ ppdm_api_ver }}/components"
  when: get_ppdm_components_id | default('', false) | trim == ''
- name: Get PPDM Components with status {{ get_ppdm_components_condition }}
  uri:
    method: GET
    url: "{{ get_ppdm_components_uri }}"
    body_format: json
    headers:
      accept: application/json
      authorization: "Bearer {{ access_token }}"
    status_code: 200,500
    validate_certs: false
  register: get_ppdm_components_result
  until: "{{ get_ppdm_components_condition }}"
  retries: "{{ get_ppdm_components_retries }}"
  delay: "{{ get_ppdm_components_delay }}"
  when: not ansible_check_mode
- set_fact:
    get_ppdm_components_components: "{{ get_ppdm_components_result.json }}"
