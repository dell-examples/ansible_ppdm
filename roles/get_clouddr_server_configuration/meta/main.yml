galaxy_info:
  role_name: get_clouddr_server_configuration
  author: Karsten Bott, Dell Technologies
  description: Retrieve Cloud DR server configuration from PowerProtect Data Manager (PPDM) using the REST API
  company: Dell Technologies
  license: MIT
  min_ansible_version: 2.9
  platforms:
    - name: EL
      versions:
        - 7
        - 8
        - 9
    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
    - name: Debian
      versions:
        - buster
        - bullseye
    - name: GenericLinux
      versions:
        - any
  galaxy_tags:
    - ppdm
    - powerprotect
    - dell
    - backup
    - recovery
    - storage
    - protection
    - cloud-dr
    - disaster-recovery

dependencies: []

ppdm_api:
  version: "20.3.0"
  endpoint: /api/v2/clouddr-server-configurations
  method: GET

variables:
  required:
    - name: ppdm_baseurl
      type: string
      description: The base URL of the PPDM server
      default: null
    - name: ppdm_port
      type: integer
      description: The port number for the PPDM API
      default: 8443
    - name: ppdm_api_ver
      type: string
      description: The API version path
      default: /api/v2
    - name: access_token
      type: string
      description: The PPDM access token for authentication
      default: null
  optional:
    - name: get_clouddr_server_configuration_filter
      type: string
      description: Filter query to narrow down results
      default: ""
    - name: get_clouddr_server_configuration_delay
      type: integer
      description: Delay between retries in seconds
      default: 1
    - name: get_clouddr_server_configuration_retries
      type: integer
      description: Number of retries for the API call
      default: 1
    - name: get_clouddr_server_configuration_condition
      type: string
      description: Condition for the until loop
      default: "get_clouddr_server_configuration_result is defined"

output_variables:
  - name: get_clouddr_server_configuration_clouddr_server_configuration
    type: object
    description: The Cloud DR server configuration retrieved from PPDM
  - name: get_clouddr_server_configuration_result
    type: object
    description: The full API response

examples:
  - name: Get Cloud DR server configuration
    code: |
      - name: Get Cloud DR server configuration
        include_role:
          name: get_clouddr_server_configuration
        vars:
          ppdm_baseurl: "https://ppdm.example.com"
          access_token: "{{ ppdm_token }}"
